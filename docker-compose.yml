version: "3.8"
services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: cloudstack
      POSTGRES_DB: cloudstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudstack"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: backend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${HOST_STORAGE_PATH}:/app/storage
    environment:
      - DATABASE_URL=postgresql+psycopg2://cloudstack:${POSTGRES_PASSWORD}@db/cloudstack
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "1111:1111"
    restart: unless-stopped

  frontend:
    build: frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
