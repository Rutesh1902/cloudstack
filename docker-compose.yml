services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloudstack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudstack"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    ports:
      - "1111:1111"
    volumes:
      - ${HOST_STORAGE_PATH:?Set HOST_STORAGE_PATH to your data disk}:/data/cloudstack
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 1111"
volumes:
  postgres_data:
